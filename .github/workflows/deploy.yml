name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://artechnohub.com.np

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType File -Path out/.nojekyll -Force | Out-Null
          if (Test-Path CNAME) { Copy-Item CNAME out/CNAME -Force }
          Get-ChildItem out -Recurse -Filter *.html | Select-Object -First 3 -ExpandProperty FullName

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Ping Bing the moment a deploy lands, instead of waiting for its next
  # crawl. Skipped silently when INDEXNOW_KEY is not set in repo secrets.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ secrets.INDEXNOW_KEY != '' }}
    steps:
      - name: Notify Bing IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: https://artechnohub.com.np
        run: |
          KEY="$INDEXNOW_KEY"
          # IndexNow fetches keyLocation over HTTP to verify ownership, so the
          # key file must be served from the site. It is committed under
          # public/ (an IndexNow key is a public verification token, not a
          # secret) and deployed by the build job before this runs.
          KEYLOC="$SITE_URL/$KEY.txt"
          for f in $(find out -name '*.html' -not -name '404.html' -not -name '500.html'); do
            URL="$SITE_URL/${f#out/}"
            URL="${URL%/index.html}/"
            curl -sS -o /dev/null -w "%{http_code}  $URL\n" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -H "Api-Key: $KEY" \
              -H "Location: $URL" \
              --data "{\"host\":\"artechnohub.com.np\",\"key\":\"$KEY\",\"keyLocation\":\"$KEYLOC\",\"urlList\":[\"$URL\"]}"
            sleep 0.2
          done
          echo "indexnow: 200/202 = accepted, 400 = rejected, 422 = bad key location"
